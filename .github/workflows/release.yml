name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build & release macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ad-hoc signed DMG
        run: npm run dist
        env:
          # Use package.json mac.identity "-" (ad-hoc); do not pick a machine cert.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="Agent Widget ${TAG}"
            PRERELEASE="false"
          else
            # Rolling release for master pushes — same tag until package.json version bumps.
            TAG="v${VERSION}"
            NAME="Agent Widget v${VERSION}"
            PRERELEASE="false"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "prerelease=${PRERELEASE}"
            echo "short_sha=${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${TAG} (${NAME})"
          ls -lh release/*.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Unsigned macOS build of Agent Widget.

            **Commit:** `${{ steps.meta.outputs.short_sha }}`
            **Version:** `${{ steps.meta.outputs.version }}`

            Download the `.dmg`, open it, and drag **Agent Widget** into Applications.

            This build is not notarized. Use Gatekeeper / “Open anyway” if macOS blocks the first launch.
          files: |
            release/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
