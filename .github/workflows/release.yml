name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ad-hoc signed DMG
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            release/*.dmg
            release/*.blockmap
          if-no-files-found: error

  windows:
    name: Build Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="Agent Widget ${TAG}"
            PRERELEASE="false"
          else
            TAG="v${VERSION}"
            NAME="Agent Widget v${VERSION}"
            PRERELEASE="false"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "prerelease=${PRERELEASE}"
            echo "short_sha=${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${TAG} (${NAME})"
          find release-assets -type f -print | sort
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Cross-platform build of Agent Widget.

            **Commit:** `${{ steps.meta.outputs.short_sha }}`
            **Version:** `${{ steps.meta.outputs.version }}`

            ### macOS
            Download the `.dmg`, open it, and drag **Agent Widget** into Applications.
            Ad-hoc signed (not notarized) — use Gatekeeper / “Open Anyway” on first launch.

            ### Windows
            Run the `.exe` installer. If SmartScreen warns, choose **More info** → **Run anyway**.

            ### Linux
            `chmod +x` the `.AppImage`, then run it. Some desktops need an AppIndicator/tray package for the tray icon.

            You still need a Cursor (`agent`) or Claude (`claude`) CLI on your PATH.
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
