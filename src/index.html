<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" data-mode="collapsed">
      <div id="pill" role="button" tabindex="0" data-boot="1" aria-busy="true" aria-label="Cursor Agent" title="Click to open · Drag to move · ✕ to quit">
        <span class="orb" aria-hidden="true"></span>
        <span class="pill-copy">
          <span class="pill-title">Agent</span>
          <span class="pill-sub">starting…</span>
        </span>
        <button id="pill-quit" type="button" title="Quit" aria-label="Quit Agent Widget">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path
              d="M3 3l6 6M9 3L3 9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <section id="panel" aria-hidden="true">
        <header id="chrome" class="drag">
          <div class="brand">
            <span class="orb small" aria-hidden="true"></span>
            <div class="brand-text">
              <strong id="brand-title">Cursor Agent</strong>
              <span id="workspace-label">~/</span>
            </div>
          </div>
          <div class="actions no-drag">
            <label class="agent-picker" data-tip="Open agent in a new tab">
              <span class="sr-only">Agent</span>
              <select id="agent-select" aria-label="Open agent in a new tab">
                <option value="cursor">Cursor</option>
                <option value="claude">Claude</option>
              </select>
            </label>
            <button id="btn-add-agent" type="button" data-tip="Add custom agent" aria-label="Add custom agent">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-remove-agent" type="button" data-tip="Remove custom agent" aria-label="Remove custom agent" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-workspace" type="button" data-tip="Choose workspace folder" aria-label="Choose workspace folder">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h4l1.2 1.5H13.5v6.5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-restart" type="button" data-tip="Restart agent" aria-label="Restart agent">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.4-3.4M13 3v3.2H9.8" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-top" type="button" data-tip="Keep above other windows" aria-label="Keep above other windows" aria-pressed="true">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 12.5h10M5 9.5h6M7 6.5h2M8 3.5v5" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-login" type="button" data-tip="Open at login" aria-label="Open at login" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v5.2M5.2 4.2a4.8 4.8 0 1 0 5.6 0" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-collapse" type="button" data-tip="Collapse" aria-label="Collapse">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-quit" type="button" data-tip="Quit" aria-label="Quit" class="danger">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
        </header>
        <div id="tab-bar" class="no-drag">
          <div id="tab-list" role="tablist" aria-label="Agent tabs"></div>
          <button id="btn-new-tab" type="button" data-tip="New tab" aria-label="New tab">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-close-all-tabs" type="button" data-tip="Close all tabs" aria-label="Close all tabs">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5M3 8h10" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="agent-add" class="no-drag" hidden>
          <input
            id="agent-command-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Command e.g. codex, aider, /usr/local/bin/my-agent"
          />
          <input
            id="agent-label-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Label (optional)"
          />
          <button id="btn-agent-save" type="button">Add</button>
          <button id="btn-agent-cancel" type="button">Cancel</button>
        </div>
        <div id="terminal" class="no-drag"></div>
        <footer id="hint" class="no-drag">
          <span><span id="hint-shortcut">⌘⇧A</span> toggle</span>
          <span>running <code id="hint-command">agent</code></span>
        </footer>
      </section>
    </div>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
